<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>OCR tlakomjer realtime</title>

<style>
body { font-family: system-ui; padding: 10px; }

#wrap {
  position: relative;
  display: inline-block;
}

video {
  width: 360px;
  border-radius: 10px;
}

canvas#overlay {
  position: absolute;
  top: 0;
  left: 0;
}

#result {
  margin-top: 10px;
  background: #f5f5f5;
  padding: 10px;
}
</style>
</head>

<body>

<h3>Kamera + OCR (tlakomjer)</h3>

<button onclick="startCamera()">Start</button>
<button onclick="stopCamera()">Stop</button>

<br><br>

<div id="wrap">
  <video id="video" autoplay playsinline></video>
  <canvas id="overlay"></canvas>
</div>

<div id="result">Čekam...</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const result = document.getElementById('result');

let stream = null;
let worker = null;
let running = false;

// ✅ ROI - samo taj dio ide u OCR
const roi = {
  x: 80,
  y: 50,
  w: 200,
  h: 160
};

async function startCamera() {
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" }
  });

  video.srcObject = stream;

  await new Promise(res => video.onloadedmetadata = res);
  await video.play();

  overlay.width = video.clientWidth;
  overlay.height = video.clientHeight;

  // ✅ init worker (jednom!)
  worker = await Tesseract.createWorker('eng');

  running = true;
  loop();
}

async function loop() {
  if (!running) return;

  drawOverlay();

  await runOCR();

  setTimeout(loop, 800); // ✅ real-time interval
}

function drawOverlay() {
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  // zatamni sve
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.fillRect(0, 0, overlay.width, overlay.height);

  // prozor (ROI)
  ctx.clearRect(roi.x, roi.y, roi.w, roi.h);

  // okvir
  ctx.strokeStyle = "red";
  ctx.lineWidth = 2;
  ctx.strokeRect(roi.x, roi.y, roi.w, roi.h);
}

async function runOCR() {
  if (!video.videoWidth) return;

  const scaleX = video.videoWidth / overlay.width;
  const scaleY = video.videoHeight / overlay.height;

  const sx = roi.x * scaleX;
  const sy = roi.y * scaleY;
  const sw = roi.w * scaleX;
  const sh = roi.h * scaleY;

  const canvas = document.createElement('canvas');
  const cctx = canvas.getContext('2d');

  canvas.width = sw * 0.6;
  canvas.height = sh * 0.6;

  cctx.drawImage(video, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);

  // ✅ preprocessing
  const img = cctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = img.data;

  for (let i = 0; i < d.length; i += 4) {
    const gray = (d[i] + d[i+1] + d[i+2]) / 3;
    const val = gray > 130 ? 255 : 0;
    d[i] = d[i+1] = d[i+2] = val;
  }

  cctx.putImageData(img, 0, 0);

  const { data } = await worker.recognize(canvas, {
    tessedit_char_whitelist: '0123456789'
  });

  const text = data.text;

  // parsing
  const nums = text.match(/\d+/g) || [];

  result.innerText =
    "Raw:\n" + text +
    "\n\nSYS: " + (nums[0] || '?') +
    "\nDIA: " + (nums[1] || '?') +
    "\nPULSE: " + (nums[2] || '?');
}

async function stopCamera() {
  running = false;

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  if (worker) {
    await worker.terminate();
  }

  result.innerText = "Stopped";
}
</script>

</body>
</html>
