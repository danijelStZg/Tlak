<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Omron OCR Auto</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body { font-family: system-ui; padding: 10px; }
video { width: 360px; border-radius: 10px; }
canvas { position: absolute; top: 0; left: 0; }
#wrap { position: relative; display: inline-block; }
pre { background: #f5f5f5; padding: 10px; margin-top:10px; }
</style>

<script>
var Module = {
  locateFile: path => "https://cdn.jsdelivr.net/npm/opencv-wasm@4.3.0-10/" + path
};
</script>

<script src="https://cdn.jsdelivr.net/npm/opencv-wasm/"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

</head>

<body>

<h3>Auto OCR tlakomjer</h3>

<button onclick="start()">Start</button>
<button onclick="stop()">Stop</button>

<br><br>

<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<pre id="status">Klikni Start</pre>
<pre id="result">---</pre>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');

const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

let stream = null;
let worker = null;
let running = false;

// ✅ memorija za stabilizaciju
let history = {
  sys: [],
  dia: [],
  pulse: []
};

function stabilize(arr) {
  if (!arr.length) return null;
  let counts = {};
  arr.forEach(v => counts[v] = (counts[v]||0)+1);
  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a])[0];
}

// ✅ START
async function start() {
  try {
    statusEl.innerText = "Pokrećem kameru...";

    // kamera
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } }
    });

    video.srcObject = stream;

    await new Promise(res => {
      video.onloadedmetadata = () => {
        video.play().then(res);
      };
    });

    overlay.width = video.clientWidth;
    overlay.height = video.clientHeight;

    // OCR worker
    worker = await Tesseract.createWorker('eng');
    await worker.setParameters({
      tessedit_char_whitelist: '0123456789'
    });

    running = true;
    loop();

  } catch (e) {
    statusEl.innerText = "❌ " + e.message;
  }
}

// ✅ GLAVNI LOOP
async function loop() {
  if (!running) return;

  let box = detectDisplay();

  drawOverlay(box);

  if (box) {
    let processed = preprocess(box);
    let values = await readValues(processed);

    push(values);

    resultEl.innerText = JSON.stringify({
      sys: stabilize(history.sys),
      dia: stabilize(history.dia),
      pulse: stabilize(history.pulse)
    }, null, 2);
  }

  setTimeout(loop, 800);
}

// ✅ AUTO-DETECT
function detectDisplay() {
  if (!video.videoWidth) return null;

  let canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  let ctx = canvas.getContext('2d');
  ctx.drawImage(video,0,0);

  let src = cv.imread(canvas);
  let gray = new cv.Mat();
  let edges = new cv.Mat();

  cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY);
  cv.Canny(gray, edges, 50, 150);

  let contours = new cv.MatVector();
  let hierarchy = new cv.Mat();

  cv.findContours(edges, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

  let best = null;
  let maxArea = 0;

  for (let i=0;i<contours.size();i++){
    let cnt = contours.get(i);
    let area = cv.contourArea(cnt);

    if (area > maxArea) {
      let rect = cv.boundingRect(cnt);
      best = rect;
      maxArea = area;
    }
  }

  src.delete(); gray.delete(); edges.delete();
  contours.delete(); hierarchy.delete();

  return best;
}

// ✅ DRAW
function drawOverlay(box) {
  ctx.clearRect(0,0,overlay.width,overlay.height);

  if (!box) return;

  let sx = overlay.width / video.videoWidth;
  let sy = overlay.height / video.videoHeight;

  ctx.strokeStyle = "red";
  ctx.lineWidth = 2;

  ctx.strokeRect(
    box.x * sx,
    box.y * sy,
    box.width * sx,
    box.height * sy
  );
}

// ✅ PREPROCESSING
function preprocess(box) {
  let canvas = document.createElement('canvas');
  let ctx = canvas.getContext('2d');

  canvas.width = box.width * 0.6;
  canvas.height = box.height * 0.6;

  ctx.drawImage(video,
    box.x, box.y, box.width, box.height,
    0,0,canvas.width,canvas.height
  );

  let img = ctx.getImageData(0,0,canvas.width,canvas.height);
  let d = img.data;

  for (let i=0;i<d.length;i+=4){
    let g = (d[i]+d[i+1]+d[i+2])/3;
    let v = g>130 ? 255:0;
    d[i]=d[i+1]=d[i+2]=v;
  }

  ctx.putImageData(img,0,0);

  return canvas;
}

// ✅ OCR 3 ZONE
async function readValues(canvas) {
  let h = canvas.height;

  let zones = [
    {y:0, h:h/3},
    {y:h/3, h:h/3},
    {y:2*h/3, h:h/3}
  ];

  let values = [];

  for (let z of zones) {
    let c = document.createElement('canvas');
    c.width = canvas.width;
    c.height = z.h;

    let cx = c.getContext('2d');
    cx.drawImage(canvas, 0, z.y, c.width, z.h, 0,0,c.width,z.h);

    let res = await worker.recognize(c);
    let num = (res.data.text.match(/\d+/)||[])[0];

    values.push(num);
  }

  return values;
}

// ✅ STABILIZACIJA
function push(vals) {
  if (!vals) return;

  if (vals[0]) history.sys.push(vals[0]);
  if (vals[1]) history.dia.push(vals[1]);
  if (vals[2]) history.pulse.push(vals[2]);

  if (history.sys.length > 5) history.sys.shift();
  if (history.dia.length > 5) history.dia.shift();
  if (history.pulse.length > 5) history.pulse.shift();
}

// ✅ STOP
function stop() {
  running = false;

  if (stream) {
    stream.getTracks().forEach(t=>t.stop());
  }

  if (worker) worker.terminate();

  statusEl.innerText = "Stop";
}
</script>

</body>
</html>
