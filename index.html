<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Kamera test + OCR</title>

<style>
body { font-family: system-ui; padding: 10px; }
video { width: 360px; border-radius: 10px; }
canvas { position: absolute; top: 0; left: 0; }
#wrap { position: relative; display: inline-block; }
</style>
</head>

<body>

<h3>Kamera test (robusni start)</h3>

<button onclick="start()">Start kamera</button>
<button onclick="stop()">Stop</button>

<br><br>

<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
</div>

<pre id="status">Klikni Start</pre>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<script>
const video = document.getElementById('video');
const overlay = document.getElementById('overlay');
const ctx = overlay.getContext('2d');
const status = document.getElementById('status');

let stream = null;

// ✅ ✅ ISPRAVLJENA START FUNKCIJA
async function start() {
  try {
    status.innerText = "Tražim pristup kameri...";

    // ✅ fallback varijante (radi na svim browserima)
    const constraints = {
      video: {
        facingMode: { ideal: "environment" }
      }
    };

    stream = await navigator.mediaDevices.getUserMedia(constraints);

    video.srcObject = stream;

    // ✅ kritični dio – osiguraj play
    await new Promise(resolve => {
      video.onloadedmetadata = () => {
        video.play().then(resolve);
      };
    });

    // ✅ postavi canvas dimenzije
    overlay.width = video.clientWidth;
    overlay.height = video.clientHeight;

    status.innerText = "✅ Kamera pokrenuta";

    draw();

  } catch (e) {
    status.innerText = "❌ Greška: " + e.message;

    console.error(e);
  }
}

function draw() {
  ctx.clearRect(0, 0, overlay.width, overlay.height);

  ctx.strokeStyle = "red";
  ctx.lineWidth = 2;

  ctx.strokeRect(80, 60, 200, 150); // demo ROI

  requestAnimationFrame(draw);
}

// ✅ STOP
function stop() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
  }

  video.srcObject = null;
  status.innerText = "⛔ Kamera zaustavljena";
}
</script>

</body>
</html>
