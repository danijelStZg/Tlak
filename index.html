<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Real-time OCR tlakomjer (browser)</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-start; }
    .panel { max-width: 420px; }
    #wrap { position: relative; display: inline-block; }
    video { width: min(420px, 92vw); border-radius: 10px; background:#000; }
    canvas#overlay { position: absolute; left: 0; top: 0; pointer-events: auto; }
    pre { background: #f6f6f6; padding: 10px; border-radius: 8px; overflow:auto; }
    button { padding: 10px 12px; border-radius: 10px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    button.primary { background:#0b5fff; color:#fff; border-color:#0b5fff; }
    small { color: #555; }
  </style>
</head>
<body>
  <h2>Real-time očitanje tlakomjera (kamera → brojevi)</h2>

  <div class="row">
    <div class="panel">
      <div style="display:flex; gap:8px; margin-bottom:10px;">
        <button id="start" class="primary">Start kamera</button>
        <button id="stop">Stop</button>
      </div>
      <small>
        1) Klikni “Start kamera”  2) Povuci pravokutnik preko brojki (ROI)  3) Očitavanje kreće automatski.
      </small>

      <div id="wrap" style="margin-top:10px;">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
      </div>
    </div>

    <div class="panel">
      <h3>OCR raw</h3>
      <pre id="raw">—</pre>

      <h3>Parsed (SYS/DIA/PULSE)</h3>
      <pre id="parsed">—</pre>

      <h3>Status</h3>
      <pre id="status">idle</pre>
    </div>
  </div>

  <!-- Tesseract.js preko CDN-a; nakon toga je globalno dostupan Tesseract i možeš kreirati worker. 【3-29ec72】 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const video = document.getElementById('video');
    const overlay = document.getElementById('overlay');
    const octx = overlay.getContext('2d');

    const rawEl = document.getElementById('raw');
    const parsedEl = document.getElementById('parsed');
    const statusEl = document.getElementById('status');

    const startBtn = document.getElementById('start');
    const stopBtn  = document.getElementById('stop');

    // Offscreen canvas za OCR (brže, manja rezolucija)
    const work = document.createElement('canvas');
    const wctx = work.getContext('2d', { willReadFrequently: true });

    let stream = null;
    let worker = null;
    let running = false;
    let busy = false;

    // ROI selekcija
    let roi = { x: 40, y: 60, w: 220, h: 180 }; // default, možeš povući
    let dragging = false;
    let dragStart = null;

    // Throttle (npr. 700ms između OCR runova)
    let lastRun = 0;
    const OCR_INTERVAL_MS = 700;

    function drawOverlay() {
      if (!video.videoWidth) return;
      overlay.width = video.clientWidth;
      overlay.height = video.clientHeight;

      octx.clearRect(0,0,overlay.width,overlay.height);

      // ROI okvir
      octx.strokeStyle = 'rgba(255,0,0,0.9)';
      octx.lineWidth = 2;
      octx.strokeRect(roi.x, roi.y, roi.w, roi.h);

      // zatamnjenje izvan ROI
      octx.fillStyle = 'rgba(0,0,0,0.25)';
      octx.fillRect(0,0,overlay.width,overlay.height);
      octx.clearRect(roi.x, roi.y, roi.w, roi.h);

      // Label
      octx.fillStyle = 'rgba(255,0,0,0.9)';
      octx.font = '12px system-ui';
      octx.fillText('ROI', roi.x + 4, Math.max(12, roi.y - 6));
    }

    function clampRoi() {
      roi.x = Math.max(0, Math.min(roi.x, overlay.width - 10));
      roi.y = Math.max(0, Math.min(roi.y, overlay.height - 10));
      roi.w = Math.max(20, Math.min(roi.w, overlay.width - roi.x));
      roi.h = Math.max(20, Math.min(roi.h, overlay.height - roi.y));
    }

    function overlayToVideoScale() {
      // map overlay koordinata na stvarnu video rezoluciju
      const sx = video.videoWidth / overlay.width;
      const sy = video.videoHeight / overlay.height;
      return { sx, sy };
    }

    // Jednostavan binarni threshold (pomaže 7-seg)
    function preprocessToBW() {
      const img = wctx.getImageData(0, 0, work.width, work.height);
      const d = img.data;
      for (let i=0; i<d.length; i+=4) {
        const gray = (d[i] + d[i+1] + d[i+2]) / 3;
        const v = gray > 140 ? 255 : 0; // prag; po potrebi ćeš kasnije “tweakati”
        d[i] = d[i+1] = d[i+2] = v;
      }
      wctx.putImageData(img, 0, 0);
    }

    function parseSysDiaPulse(text) {
      const nums = (text || "").match(/\d+/g) || [];
      const clean = nums.map(n => n.trim()).filter(n => n.length >= 2 && n.length <= 3);

      // Heuristika: prva tri “normalna” broja
      return {
        sys: clean[0] || null,
        dia: clean[1] || null,
        pulse: clean[2] || null
      };
    }

    async function ensureWorker() {
      if (worker) return;
      statusEl.textContent = "init worker...";
      // Preporuka: kreirati worker jednom i reuse za više jobova, radi performansi. 【4-184b3c】
      worker = await Tesseract.createWorker('eng'); // primjer createWorker iz dokumentacije 【3-29ec72】
      statusEl.textContent = "worker ready";
    }

    async function ocrTick() {
      if (!running) return;

      // Throttling: nemoj OCR svaki frame (inače preteško). 【5-11413b】
      const now = Date.now();
      if (now - lastRun < OCR_INTERVAL_MS || busy) {
        requestAnimationFrame(ocrTick);
        return;
      }
      lastRun = now;
      busy = true;

      try {
        drawOverlay();

        const { sx, sy } = overlayToVideoScale();
        const vx = Math.round(roi.x * sx);
        const vy = Math.round(roi.y * sy);
        const vw = Math.round(roi.w * sx);
        const vh = Math.round(roi.h * sy);

        // Skaliraj ROI na manju rezoluciju (brže)
        const scale = 0.6;
        work.width = Math.max(60, Math.round(vw * scale));
        work.height = Math.max(60, Math.round(vh * scale));

        wctx.drawImage(video, vx, vy, vw, vh, 0, 0, work.width, work.height);
        preprocessToBW();

        statusEl.textContent = "OCR...";
        // OCR (whitelist brojeva pomaže)
        const res = await worker.recognize(work, {
          tessedit_char_whitelist: '0123456789',
        });

        const text = (res && res.data && res.data.text) ? res.data.text : "";
        rawEl.textContent = text || "—";

        const parsed = parseSysDiaPulse(text);
        parsedEl.textContent = JSON.stringify(parsed, null, 2);
        statusEl.textContent = "ok";
      } catch (e) {
        statusEl.textContent = "error: " + (e?.message || e);
      } finally {
        busy = false;
        requestAnimationFrame(ocrTick);
      }
    }

    async function startCamera() {
      if (running) return;
      running = true;

      // Kamera
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      });
      video.srcObject = stream;

      
wait new Promise(resolve => {
  video.onloadedmetadata = () => {
    video.play();
    resolve();
  };
});


      // uskladi overlay s video elementom
      drawOverlay();

      await ensureWorker();
      requestAnimationFrame(ocrTick);
    }

    async function stopAll() {
      running = false;
      busy = false;
      statusEl.textContent = "stopping...";

      if (stream) {
        stream.getTracks().forEach(t => t.stop());
        stream = null;
      }
      video.srcObject = null;

      if (worker) {
        await worker.terminate();
        worker = null;
      }
      statusEl.textContent = "stopped";
    }

    // ROI drag selekcija (povuci pravokutnik)
    overlay.addEventListener('pointerdown', (ev) => {
      dragging = true;
      dragStart = { x: ev.offsetX, y: ev.offsetY };
      roi.x = dragStart.x;
      roi.y = dragStart.y;
      roi.w = 10;
      roi.h = 10;
      clampRoi();
      drawOverlay();
    });

    overlay.addEventListener('pointermove', (ev) => {
      if (!dragging) return;
      const x2 = ev.offsetX;
      const y2 = ev.offsetY;
      roi.w = x2 - dragStart.x;
      roi.h = y2 - dragStart.y;
      if (roi.w < 0) { roi.x = x2; roi.w = Math.abs(roi.w); }
      if (roi.h < 0) { roi.y = y2; roi.h = Math.abs(roi.h); }
      clampRoi();
      drawOverlay();
    });

    overlay.addEventListener('pointerup', () => { dragging = false; dragStart = null; });
    overlay.addEventListener('pointercancel', () => { dragging = false; dragStart = null; });

    startBtn.addEventListener('click', startCamera);
    stopBtn.addEventListener('click', stopAll);

    // redraw overlay na resize
    window.addEventListener('resize', drawOverlay);
  </script>
</body>
</html>
